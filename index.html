<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Create your tile map with this online Tile Map Editor" />
    <link rel="stylesheet" href="src/styles.css" />
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#317EFB">
    <link rel="apple-touch-icon" href="/icon.png">
    <style>
      * { box-sizing: border-box; }
      html { width: 100%; height: 100%; }
      body { overflow: hidden; height: 100%; overscroll-behavior-y: none; margin: 0; }
      #snackbar {
        visibility: hidden; min-width: 250px; margin-left: -125px; background-color: #333;
        color: #fff; text-align: center; border-radius: 2px; padding: 16px;
        position: fixed; z-index: 1; left: 50%; bottom: 30px;
      }
      #snackbar.show { visibility: visible; -webkit-animation: fadein 0.5s; animation: fadein 0.5s; }
      @-webkit-keyframes fadein { from { bottom: 0; opacity: 0; } to { bottom: 30px; opacity: 1; } }
      @keyframes fadein { from { bottom: 0; opacity: 0; } to { bottom: 30px; opacity: 1; } }
    </style>
    <script src="src/tilemap-editor.js"></script>
    <title>TileMapEditor.js</title>
  </head>
  <body>
  <div id="tileMapEditor"></div>
  <button id="addPwaBtn" >🍰 Install pwa</button>
  <div id="snackbar">A new version of this app is available.<a id="reload"> Click here to update.</a></div>

  <script type="module" src="importers/tiled.js"></script>
  <script type="module">
    import importTiledJson from './importers/tiled.js';
    importTiledJson();

    // Kosongin data biar start dari kanvas kosong
    const ioJsonData = { "tileSets": {}, "maps": {} }; 

    // KOSONGIN GAMBAR BAWAAN
    let tileSetImages = []; 

    let tileSize = 32;
    let mapWidth = 40; 
    let mapHeight = 40; 
    let tileMapData = ioJsonData;

    const initTilemapEditor = () => {
      console.log("INIT with", {tileSetImages, tileSize})
      TilemapEditor.init("tileMapEditor",{
        tileMapData: tileMapData,
        tileSize: tileSize,
        mapWidth: mapWidth,
        mapHeight: mapHeight,
        tileSetImages: tileSetImages,
        // INI FITUR IMPOR GAMBAR DARI HP
        tileSetLoaders: {
          fromLocalFile: {
            name: "📱 Pilih Gambar dari HP", // Nama menu yang akan muncul
            onSelectImage: (setSrc, file, base64) => {
              // setSrc langsung mengambil data base64 dari gambar yang dipilih
              setSrc(base64); 
            }
          },
          fromUrl: {
            name: "🌐 Dari Link URL",
            prompt: (setSrc) => {
              const fileUrl = window.prompt("Masukkan URL gambar:", "https://i.imgur.com/ztwPZOI.png");
              if(fileUrl !== null) setSrc(fileUrl)
            }
          }
        },
        onApply: {
          onClick: ({flattenedData, maps, tileSets, activeMap}) => {
            // Fitur Download JSON
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({maps, tileSets}, null, 2));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href",     dataStr);
            downloadAnchorNode.setAttribute("download", "peta_buatan_gue.json");
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
          },
          buttonText: "Download Peta", 
        }
      })
    }

    initTilemapEditor()
    
    // Pwa stuff
    let newWorker;
    function showUpdateBar() {
      let snackbar = document.getElementById('snackbar');
      snackbar.className = 'show';
    }
    document.getElementById('reload').addEventListener('click', function(){
      newWorker.postMessage({ action: 'skipWaiting' });
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/tilemap-editor/sw.js').then(reg => {
        reg.addEventListener('updatefound', () => {
          newWorker = reg.installing;
          newWorker.addEventListener('statechange', () => {
            switch (newWorker.state) {
              case 'installed':
                if (navigator.serviceWorker.controller) { showUpdateBar(); }
                break;
            }
          });
        });
      });
    }
    let refreshing;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (refreshing) return;
      window.location.reload();
      refreshing = true;
    });

    let deferredPrompt;
    const addBtn = document.getElementById("addPwaBtn");
    addBtn.style.display = 'none';
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      addBtn.style.display = 'block';
      addBtn.addEventListener('click', () => {
        addBtn.style.display = 'none';
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          deferredPrompt = null;
        });
      });
    });
    window.addEventListener('appinstalled', () => {
      addBtn.style.display = 'none';
      deferredPrompt = null;
    });
  </script>

  <style>
    #addPwaBtn {
      position: absolute; bottom: 10px; left: 50%; background: #1a1a1a;
      color: yellow; border: 1px solid grey; border-radius: 3px; padding: 10px;
    }
  </style>
  </body>
</html>
